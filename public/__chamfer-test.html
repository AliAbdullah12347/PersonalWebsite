<!doctype html>
<meta charset="utf-8">
<title>chamfer test 2</title>
<style>
  body { background:#06060a; margin:0; padding:24px; display:flex; gap:34px; flex-wrap:wrap;
         font:11px monospace; color:#7e8092; }
  figure{margin:0}
  .cyber-panel {
    background: rgba(16,16,26,0.85);
    border: 1px solid #1e1e2f;
    box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5);
    position:relative; backdrop-filter: blur(8px);
    width: 150px; height: 90px;
  }
  .cut-corners {
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  }
  .mag { zoom: 3.2; }
  .stroke { background-position: right top, left bottom; background-size:16px 16px;
            background-repeat:no-repeat; background-origin: border-box; }

  /* real ship color #1e1e2f, band 10.6->12 (1.4px) as proposed */
  #p1 { background-image:
      linear-gradient(225deg,transparent 0 10.6px,#1e1e2f 10.6px 12px,transparent 12px),
      linear-gradient(45deg, transparent 0 10.6px,#1e1e2f 10.6px 12px,transparent 12px); }
  /* real ship color, band centred on 11.31 with ~1.1px width */
  #p2 { background-image:
      linear-gradient(225deg,transparent 0 10.75px,#1e1e2f 10.75px 11.85px,transparent 11.85px),
      linear-gradient(45deg, transparent 0 10.75px,#1e1e2f 10.75px 11.85px,transparent 11.85px); }
  /* E: drop-shadow on parent wrapper */
  .wrap { filter: drop-shadow(0 14px 22px rgba(0,0,0,0.9)); width:150px; height:90px; }
</style>
<figure><figcaption>P1 #1e1e2f 1.4px band</figcaption>
  <div class="mag"><div class="cyber-panel cut-corners stroke" id="p1"></div></div></figure>
<figure><figcaption>P2 #1e1e2f 1.1px band</figcaption>
  <div class="mag"><div class="cyber-panel cut-corners stroke" id="p2"></div></div></figure>
<figure><figcaption>E parent drop-shadow</figcaption>
  <div class="mag"><div class="wrap"><div class="cyber-panel cut-corners stroke" id="p2b"
    style="width:100%;height:100%;background-image:linear-gradient(225deg,transparent 0 10.75px,#1e1e2f 10.75px 11.85px,transparent 11.85px),linear-gradient(45deg,transparent 0 10.75px,#1e1e2f 10.75px 11.85px,transparent 11.85px)"></div></div></div></figure>
<figure><figcaption>BASE (no stroke, today)</figcaption>
  <div class="mag"><div class="cyber-panel cut-corners"></div></div></figure>
